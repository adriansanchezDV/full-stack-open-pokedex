name: Health check

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

jobs:
  health_check:
    runs-on: ubuntu-latest

    steps:
      - name: Check deployed application
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://full-stack-open-pokedex-dhu5.onrender.com/health